<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet-Ops | Under Maintenance</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;background:#f4f7fb;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#172033}
.background{position:fixed;width:100%;height:100%;overflow:hidden;z-index:-1}
.circle{position:absolute;border-radius:50%;opacity:.08;background:#2563eb;animation:float 8s ease-in-out infinite}
.circle:nth-child(1){width:350px;height:350px;top:-100px;left:-100px}
.circle:nth-child(2){width:500px;height:500px;bottom:-200px;right:-150px;animation-delay:2s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(30px)}}
.maintenance-card{width:90%;max-width:650px;background:#fff;padding:60px 40px;text-align:center;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.12);animation:appear .8s ease}
@keyframes appear{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.logo{font-size:32px;font-weight:800;letter-spacing:-1px;color:#172033;margin-bottom:35px}.logo span{color:#2563eb}
.icon{width:95px;height:95px;margin:0 auto 25px;background:#eff6ff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:45px;animation:rotateSlow 4s linear infinite}
@keyframes rotateSlow{to{transform:rotate(360deg)}}
h1{font-size:32px;margin-bottom:18px;color:#172033}
p{color:#667085;font-size:16px;line-height:1.7;max-width:500px;margin:auto}
.status{margin-top:30px;display:inline-flex;align-items:center;gap:10px;background:#fff7ed;color:#c2410c;padding:12px 20px;border-radius:50px;font-size:14px;font-weight:600}
.dot{width:9px;height:9px;background:#f97316;border-radius:50%;animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(249,115,22,.6)}70%{box-shadow:0 0 0 10px rgba(249,115,22,0)}100%{box-shadow:0 0 0 0 rgba(249,115,22,0)}}
.footer{margin-top:35px;font-size:13px;color:#98a2b3}
@media(max-width:500px){.maintenance-card{padding:45px 25px}h1{font-size:27px}.logo{font-size:28px}}
</style>
</head>
<body>
<div class="background"><div class="circle"></div><div class="circle"></div></div>
<div class="maintenance-card">
<div class="logo">FLEET<span>-OPS</span></div>
<div class="icon">⚙️</div>
<h1>We're Under Maintenance</h1>
<p>Fleet-Ops is currently undergoing scheduled maintenance and improvements to provide you with a better, faster and more reliable experience.</p>
<div class="status"><div class="dot"></div>Maintenance in Progress</div>
<div class="footer">Thank you for your patience. We'll be back shortly.<br><br>© 2026 Fleet-Ops</div>
</div>
</body>
</html>
